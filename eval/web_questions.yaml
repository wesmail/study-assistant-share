  - id: web-04
    status: approved
    category: current
    group: current
    time_sensitive: true
    checked: "2026-11-04"
    question: "According to the USGS, what was the largest earthquake worldwide in October 2026: where, when, and what magnitude?"
    sources:
      - "https://earthquake.usgs.gov/fdsnws/event/1/query?format=geojson&starttime=2026-10-01&endtime=2026-11-01&minmagnitude=6.5&orderby=magnitude"
    key_points:
      - "M 7.7 (Mww), 10 km WSW of Pitaloza Arriba, Panama, on 9 October 2026 at 17:56 UTC, about 10 km deep (USGS event us6000u18k)."
