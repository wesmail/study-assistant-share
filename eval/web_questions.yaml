  - id: web-08
    status: approved
    category: outside
    group: outside
    time_sensitive: true
    checked: "2026-11-04"
    question: "What is KATRIN's most recent upper limit on the neutrino mass, at what confidence level, and from how much data?"
    sources:
      - "https://www.mpi-hd.mpg.de/mpi/en/public-relations/news/news-item/katrin-sets-new-limit-for-neutrino-mass"
      - "KATRIN Collaboration, Science 388, 180-185 (2025), \"Direct neutrino-mass measurement based on 259 days of KATRIN data\" (the 90% CL is the paper's; the MPI-HD news item gives the limit without it)"
    key_points:
      - "m_ν < 0.45 eV at 90% confidence level (published in Science, 2025)."
      - "From 259 days of data in five measurement campaigns (2019-2021), about a quarter of KATRIN's planned data, and almost twice as tight as the 0.8 eV limit of 2022."
      - "It is a direct, model-independent measurement from the tritium beta-decay spectrum near its endpoint."

  - id: web-09
    status: approved
    category: outside
    group: outside
    checked: "2026-11-04"
    question: "How do I remove the instrument response from a seismogram with ObsPy? Which method and arguments, and what does the documentation recommend?"
    sources:
      - "https://docs.obspy.org/packages/autogen/obspy.core.trace.Trace.remove_response.html"
    key_points:
      - "Trace.remove_response (or Stream.remove_response) with an inventory holding the station's response: remove_response(inventory=inv, output=\"VEL\", water_level=60, pre_filt=None, zero_mean=True, taper=True, taper_fraction=0.05, plot=False)."
      - "output is \"DISP\" (m), \"VEL\" (m/s, the default), \"ACC\" (m/s²) or \"DEF\" (the response's own units)."
      - "pre_filt (four corner frequencies f1<f2<f3<f4 of a cosine taper) and water_level (dB, clips the inverse spectrum) both guard against over-amplification when inverting the response."
      - "The documentation advises water_level=None with pre_filt when the requested output isn't the sensor's native quantity (e.g. velocity from an accelerometer), and plot=True to check the choices."

  # --- Library plus web ---------------------------------------------------------------

  - id: web-10
    status: approved
    category: library+web
    group: library+web
    time_sensitive: true
    checked: "2026-11-04"
    question: "The Sparse Transformers paper in my library reports a result on enwik8. What did it report, and what is the current Hutter Prize record for compressing enwik9?"
    expected_sources:
      - doc: *sparse
        pages: [7, 8]
    sources:
      - "library: Child et al., Generating Long Sequences with Sparse Transformers, pp. 7-8 (chunks 2148, 2149)"
      - "https://www.hutter1.net/prize/index.htm"
    key_points:
      - "Library: the Sparse Transformer (95M parameters, fixed attention) reaches 0.99 bits per byte on enwik8 (0.992 ± 0.001 over three seeds), beating the 1.03 of a similarly sized Transformer-XL and matching a Transformer-XL with more than twice the parameters."
      - "Web: the Hutter Prize record is 100,424,672 bytes in total (archive plus decompressor) by Vladimir Ivanov with fx2-cmix-T, 24 July 2026; the next award needs under 99,420,425 bytes."
      - "The two aren't directly comparable: Hutter uses enwik9 (1 GB) and counts the decompressor; the record is about 0.80 bits per byte."

  # --- The user's 11th question --------------------------------------------------------

  - id: web-11
    status: approved
    category: current
    group: current
    time_sensitive: true
    checked: "2026-11-04"
    question: "What has been published on foundation models for seismic waveforms since 2025, and what do they claim?"
    sources:
      - "U-Trans: Scientific Reports (published online 9 March 2026), doi 10.1038/s41598-026-41454-x; https://pubmed.ncbi.nlm.nih.gov/41803205/"
      - "https://arxiv.org/abs/2610.38003 (Laurenti, Liu, Kulis, Meier, Johnson; 27 October 2026)"
      - "https://arxiv.org/abs/2608.05763 (Alfarhan, Ravasi, Chen, Turkiyyah, Keyes; 6 August 2026)"
      - "https://arxiv.org/abs/2410.15765 (SeisLM, Liu et al., first posted October 2024)"
    grading_note: "This question is graded on its own rule, not on a share of the key points: good means at least three real works from 2025 on, each with its claims right, and none invented. Any real work counts, not only the examples below. Before counting any work an answer cites, check that it exists: its DOI (https://doi.org/...) or arXiv ID (https://arxiv.org/abs/...) must resolve to that title. A work you can't resolve counts as invented, which is a factual error. Real works found on 4 November 2026, as examples: U-Trans (Scientific Reports, 2026): a U-Net encoder-decoder with a compact convolutional transformer bottleneck, pretrained self-supervised to reconstruct corrupted three-component waveforms in time and frequency, on more than 2 million seismograms from three open datasets, then used for downstream earthquake tasks. | \"Are Seismic Foundation Models More Than Glorified Feature Extractors?\" (Laurenti et al., arXiv, October 2026): Mamba encoder-decoders tested frozen on picking, classification and ground-motion tasks; changing the pretraining target redistributes skill rather than raising it; they win few-shot but trail task-specific models with full data; the authors conclude they are feature extractors rather than foundation models, and that a target defined across events is needed. | Foundation Model-Assisted Full Waveform Inversion (Alfarhan et al., arXiv, August 2026): a frozen SeisLM encoder defines a feature-based misfit with a broader basin than L2, reducing cycle skipping in early-stage FWI (Marmousi, 2D and 3D Overthrust); best as an early-stage objective, not a replacement for waveform misfits."
    key_points:
      - "At least three real works from 2025 on, each with its claims right, and none invented."
      - "SeisLM (Liu et al.), the self-supervised waveform model the FWI work builds on, dates from October 2024; citing it as 2025 work is an error."
