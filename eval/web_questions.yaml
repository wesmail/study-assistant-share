# Questions for web search as a tool, kept apart from questions.yaml so
# the 35 gold questions stay exactly the 35.
#
# Same fields as questions.yaml, plus:
#   sources          where the key points were checked: the primary source first
#   checked          the date the key points were checked against those sources
#   time_sensitive   the answer can change (a new release, record, measurement or edition).
#                    run_eval.py skips such a question once `checked` is older than
#                    refresh_after_days (below, or the question's own), until its key points
#                    are checked again and the date updated; --include-stale runs it anyway.
#   expected_sources only where part of the answer is in the library (web-10)
#
# Groups: current (changes over time), outside (stable, but not in the library), library+web.
# Drafted 2026-11-04; questions and key points approved by the user on 2026-11-04, with their
# corrections (web-01, web-02); web-11 kept as an 11th question.
#   grading_note     an extra instruction to graders for this question (web-11: resolve each work)

refresh_after_days: 30

docs:
  - &sparse "1904.10509v1.pdf"

questions:

  # --- Current: the answer changes over time -------------------------------------

  - id: web-01
    status: approved
    category: current
    group: current
    time_sensitive: true
    checked: "2026-11-04"
    question: "What is the current Particle Data Group world average for the W boson mass, with its uncertainty, and how does the CDF 2022 measurement compare to it?"
    sources:
      - "https://pdglive.lbl.gov/DataBlock.action?node=S043M (Review of Particle Physics, 2026 edition)"
    key_points:
      - "The PDG 2026 value is 80.3625 ± 0.0077 GeV (80362.5 ± 7.7 MeV), labelled OUR EVALUATION: the LHC-Tevatron W-mass working group's combination."
      - "CDF 2022 measured 80.4335 GeV ± 9.4 MeV (± 6.4 stat ± 6.9 syst), about 70 MeV higher, a tension of roughly 6 standard deviations with the average."
      - "The PDG does not use the CDF 2022 result in its evaluation (listed under data not used)."
      - "The average rests on LEP, D0, ATLAS (2024), LHCb (2022) and CMS (80.3602 GeV; dating it 2024, when first presented, or 2026, when published, are both right) measurements, which agree with the Standard Model expectation."

  - id: web-02
    status: approved
    category: current
    group: current
    time_sensitive: true
    checked: "2026-11-04"
    question: "Who received the 2026 Nobel Prize in Physics, and for what work?"
    sources:
      - "https://www.nobelprize.org/prizes/physics/2026/summary/ (returned 403 to the fetcher; checked through the wire coverage below)"
      - "https://dailymaverick.co.za/article/2026-10-06-francis-halzen-wins-2026-nobel-prize-in-physics (Reuters)"
      - "https://physicsworld.com/a/francis-halzen-wins-nobel-prize-in-physics/ (UW-Madison, IceCube PI; it says \"since 1991\", but Charpak won alone in 1992: corrected by the user)"
    key_points:
      - "Francis Halzen, a Belgian-American particle physicist at the University of Wisconsin-Madison and principal investigator of IceCube; the whole prize, the first sole physics laureate since 1992 (Georges Charpak)."
      - "Motivation: \"for decisive contributions to the IceCube Neutrino Observatory and the discovery of high-energy neutrinos of astrophysical origin\"."
      - "Announced on 6 October 2026 by the Royal Swedish Academy of Sciences. Optional: the prize is 12 million Swedish crowns."

