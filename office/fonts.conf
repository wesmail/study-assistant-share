<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- The reader's Windows fonts, mounted read-only here at run time when office_fonts_dir is set.
     Scanning 576 of them took 11 s per render, so their cache is built once, by fc-cache alone
     over the fonts (app/office.py, ensure_font_cache), and mounted read-only at /opt/fontcache.
     The root is read-only, so anything else fontconfig caches goes under /tmp (HOME). -->
<fontconfig>
  <dir>/opt/fonts/windows</dir>
  <cachedir>/opt/fontcache</cachedir>
  <cachedir>/tmp/fontconfig</cachedir>
</fontconfig>
